<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="author" content="http://www.tayyuqing.com" />
    <meta name="description" content="Tay Yu Qing builds things for work, for hackathons, and for fun." />
    <link rel="canonical" href="http://www.tayyuqing.com" />
    <title>YuQing's Portfolio</title>
    <link rel="preload" href="fonts/ClashDisplay-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=TikTok+Sans&display=swap" />
    <link rel="stylesheet" href="css/home.css" />
  </head>

  <body>
    <header class="nav">
      <nav aria-label="Main">
        <!-- TODO: link to the projects section once it exists -->
        <span class="pill is-active" aria-current="page">Projects</span>
        <a class="pill" href="about.html">About</a>
      </nav>
    </header>

    <main class="container">
      <h1 class="hero">
        <span class="line">Hi, I enjoy</span>
        <span class="line">building things</span>
        <span class="line">for work
          <img class="logo mono" src="img/home/sia.svg" alt="Singapore Airlines" width="52" height="64" />
          <img class="logo" src="img/home/star-alliance.png" alt="Star Alliance" width="67" height="64" />
          <img class="logo logo-govtech mono" src="img/home/govtech.png" alt="GovTech" width="80" height="80" />,</span>
        <span class="line">for hackathons
          <img class="logo" src="img/home/cursor.svg" alt="Cursor" width="56" height="64" />
          <img class="logo mono" src="img/home/monad.svg" alt="Monad" width="71" height="64" />,</span>
        <span class="line">and for fun
          <button class="switch" type="button" role="switch" aria-checked="false" aria-label="Light mode"><span class="switch-knob"></span></button></span>
      </h1>

      <section class="projects" aria-label="Projects">
        <a class="card" href="krisshop-australia.html" style="--hover: rgba(0, 0, 0, 0.77)">
          <img src="img/krisshop-australia/krisshop-australia-thumbnail.webp" alt="" loading="lazy" width="400" height="400" />
          <span class="card-text"><span class="card-title">KrisShop Australia</span><span class="card-cat">eCommerce &amp; Loyalty Programme</span></span>
        </a>
        <a class="card" href="pps-voucher.html" style="--hover: rgba(0, 0, 0, 0.77)">
          <img src="img/voucher-redemption/voucher-cover.png" alt="" loading="lazy" width="400" height="400" />
          <span class="card-text"><span class="card-title">Voucher Redemption</span><span class="card-cat">Web Feature</span></span>
        </a>
        <a class="card" href="miles-redemption.html" style="--hover: rgba(58, 4, 97, 0.868)">
          <img src="img/miles-redemption/miles-redemption-pdp.jpg" alt="" loading="lazy" width="400" height="400" />
          <span class="card-text"><span class="card-title">Miles Redemption</span><span class="card-cat">Mobile Experience</span></span>
        </a>
        <a class="card" href="International-delivery.html">
          <img src="img/international-delivery/international-delivery-thumbnail.jpg" alt="" loading="lazy" width="400" height="400" />
          <span class="card-text"><span class="card-title">International Delivery</span><span class="card-cat">Mobile Experience</span></span>
        </a>
        <a class="card" href="interlogue.html" style="--hover: rgba(247, 141, 2, 0.77)">
          <img src="img/interlogue/interlogue-cover.jpg" alt="" loading="lazy" width="400" height="400" />
          <span class="card-text"><span class="card-title">Interlogue</span><span class="card-cat">Museum Programme</span></span>
        </a>
      </section>
    </main>

    <footer class="container footer">
      2026 © Made possible with Claude
      <img class="mono" src="img/home/claude.png" alt="" width="16" height="16" />
    </footer>
    <script>
      document.querySelector(".switch").addEventListener("click", (e) => {
        const s = e.currentTarget;
        const light = s.getAttribute("aria-checked") !== "true";
        s.setAttribute("aria-checked", light);
        document.documentElement.dataset.theme = light ? "light" : "dark";
      });
    </script>
  </body>
</html>
